<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Lab 10.03</title>
</head>

<body>
  
  <h1>To-Do List</h1>

  <label for="taskInput">New Task:</label>
  <input type="text" id="taskInput" name="taskInput">
  <button type="button" id="addBtn">Add</button>

  <ol id="orderedList">
    <li>Buy Filters<button class="done-btn">x</button></li>
    <li>Make Coffee<button class="done-btn">x</button></li>
    <li>Buy Coffee<button class="done-btn">x</button></li>
  </ol>

  <script>

    document.addEventListener("DOMContentLoaded", domLoaded);

    function domLoaded() {
      document.querySelector("#addBtn").addEventListener("click", addBtnClick);

      document.querySelector("#taskInput").addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          addBtnClick();
        }
      });

      let buttons = document.querySelectorAll(".done-btn");

      for (let i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener("click", removeTask);
      }
    }

    function addBtnClick() {
      let taskInput = document.querySelector("#taskInput");
      let task = taskInput.value;

      if (task != "") {
        addTask(task);
      }

      taskInput.value = "";
      taskInput.focus();
    }

    function addTask(task) {
      let newTask = document.createElement("li");
      newTask.innerHTML = '<span class="task-text">' + task +
        '</span><button class="done-btn">&#10006;</button>';

      document.querySelector("#orderedList").appendChild(newTask);

      let buttons = document.querySelectorAll(".done-btn")

      buttons[buttons.length - 1].addEventListener("click", removeTask)
    }

    function removeTask(event) {
      let item = event.target.parentNode
      let list = document.querySelector("#orderedList");

      list.removeChild(item);
    }
  </script>
</body>
</html>
